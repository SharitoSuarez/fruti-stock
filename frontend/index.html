<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrutiStock - Ingreso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-caja tarjeta">
    <h1 class="text-center mb-3">🍊 FrutiStock</h1>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabLogin" type="button">Ingresar</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabRegistro" type="button">Crear cuenta</button></li>
    </ul>
    <div id="mensaje"></div>
    <div class="tab-content">
      <div class="tab-pane fade show active" id="tabLogin">
        <form id="formLogin">
          <label class="form-label" for="lUsuario">Usuario</label>
          <input id="lUsuario" class="form-control mb-2" required autofocus>
          <label class="form-label" for="lClave">Contraseña</label>
          <input id="lClave" type="password" class="form-control mb-3" required>
          <button class="btn btn-fruti w-100">Ingresar</button>
        </form>
      </div>
      <div class="tab-pane fade" id="tabRegistro">
        <form id="formRegistro">
          <label class="form-label" for="rNombre">Nombre completo</label>
          <input id="rNombre" class="form-control mb-2" required>
          <label class="form-label" for="rEmail">Correo</label>
          <input id="rEmail" type="email" class="form-control mb-2" required>
          <label class="form-label" for="rUsuario">Usuario</label>
          <input id="rUsuario" class="form-control mb-2" required>
          <label class="form-label" for="rClave">Contraseña (mínimo 6 caracteres)</label>
          <input id="rClave" type="password" minlength="6" class="form-control mb-3" required>
          <button class="btn btn-fruti w-100">Crear cuenta</button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
