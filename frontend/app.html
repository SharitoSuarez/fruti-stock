<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrutiStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Plantilla fija (requisito 8): logo, datos del usuario, fecha y hora -->
  <header class="encabezado">
    <div class="marca">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="23" r="14" fill="#f28c28"/><path d="M20 9c0-5 4-7 8-7 0 5-3 8-8 7z" fill="#b7d84b"/></svg>
      FrutiStock
    </div>
    <div class="datos-usuario"><strong id="uNombre"></strong><span id="uRol"></span><small id="uEmail"></small></div>
    <div class="reloj" id="reloj"></div>
  </header>

  <!-- Menú (requisito 7): se construye en app.js según el rol -->
  <nav class="navbar navbar-expand-md menu">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuCont" aria-label="Menú"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menuCont"><ul class="navbar-nav" id="menu"></ul></div>
    </div>
  </nav>

  <main class="container py-4" id="vista"></main>

  <!-- Modal artículos -->
  <div class="modal fade" id="modalArticulo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <form id="formArticulo">
        <div class="modal-header"><h5 class="modal-title" id="tituloArt">Artículo</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body">
          <label class="form-label" for="aDescripcion">Descripción</label>
          <input id="aDescripcion" class="form-control mb-2" required>
          <label class="form-label" for="aPrecio">Precio</label>
          <input id="aPrecio" type="number" min="0" class="form-control mb-2" required>
          <label class="form-label" for="aStock">Stock</label>
          <input id="aStock" type="number" min="0" class="form-control" required>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-fruti">Guardar artículo</button></div>
      </form>
    </div></div>
  </div>

  <!-- Modal usuarios -->
  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <form id="formUsuario">
        <div class="modal-header"><h5 class="modal-title" id="tituloUs">Usuario</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body">
          <label class="form-label" for="uNom">Nombre</label>
          <input id="uNom" class="form-control mb-2" required>
          <label class="form-label" for="uCorreo">Correo</label>
          <input id="uCorreo" type="email" class="form-control mb-2" required>
          <label class="form-label" for="uUsuario">Usuario</label>
          <input id="uUsuario" class="form-control mb-2" required>
          <label class="form-label" for="uClave">Contraseña <small class="text-muted" id="ayudaClave"></small></label>
          <input id="uClave" type="password" minlength="6" class="form-control mb-2">
          <label class="form-label" for="uRolSel">Perfil</label>
          <select id="uRolSel" class="form-select"><option value="usuario">Usuario global</option><option value="admin">Administrador</option></select>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-fruti">Guardar usuario</button></div>
      </form>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
